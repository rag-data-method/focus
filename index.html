<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FocusCrawl</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; background: #0a1f2f; }
      .hero {
        position: relative;
        display: grid;
        min-height: 100svh;
        overflow: hidden;
        place-items: center;
        isolation: isolate;
      }
      .hero__image {
        position: absolute;
        z-index: -2;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero::after {
        position: absolute;
        z-index: -1;
        inset: 0;
        content: "";
        background: linear-gradient(90deg, rgb(0 0 0 / 0.58), rgb(0 0 0 / 0.18), rgb(0 0 0 / 0.58));
      }
      .hero__title {
        max-width: 18ch;
        margin: 0 1.5rem;
        color: #fff;
        font: 800 clamp(2.5rem, 8vw, 7rem) / 0.95 system-ui, sans-serif;
        letter-spacing: -0.06em;
        text-align: center;
        text-shadow: 0 0.2rem 1.5rem rgb(0 0 0 / 0.9);
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <img class="hero__image" src="Welcome%20to%20FocusCrawl%20%281%29.svg" alt="" />
      <h1 class="hero__title">Welcome to FocusCrawl</h1>
    </main>
  </body>
</html>
